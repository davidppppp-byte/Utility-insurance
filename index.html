<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蒙恩行政管理雲 v115</title>
    <!-- 1. 載入 CSS 與 字體 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8FAFC; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        .transition-soft { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
    
    <!-- 2. 載入 React 及其依賴 (使用最穩定的 CDN，預先載入 PropTypes 解決 Recharts 報錯) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
    
    <!-- 3. 載入 Lucide 圖標 -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>

    <!-- 4. 載入 Firebase 相容模式庫 (完全防禦本地 file:/// 協議引起的 CORS 載入白屏問題) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- 5. Firebase 初始化 (不使用 type="module" 確保加載順序 100% 穩定) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwWn1DFulW33W71ceSApUQk_1RWxxkFYw",
            authDomain: "utility-insurance.firebaseapp.com",
            projectId: "utility-insurance",
            storageBucket: "utility-insurance.firebasestorage.app",
            messagingSenderId: "179821070962",
            appId: "1:179821070962:web:1a2303858f965e3d4a10eb"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 封裝 FB API
        window.FB = {
            auth: auth,
            db: db,
            serverTimestamp: firebase.firestore.FieldValue.serverTimestamp
        };
        window.APP_ID = "admin-mgmt-115";
    </script>

    <!-- 6. React 應用邏輯 -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, BarChart, Bar } = Recharts;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState(null);
            const [selectedItem, setSelectedItem] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [authError, setAuthError] = useState(null);

            // 數據篩選
            const [filterLocation, setFilterLocation] = useState('全部場域');
            const [filterDateStart, setFilterDateStart] = useState('');
            const [filterDateEnd, setFilterDateEnd] = useState('');

            // 業務資料狀態
            const [insurances, setInsurances] = useState([]);
            const [payments, setPayments] = useState([]);
            const [powerBills, setPowerBills] = useState([]);
            const [waterBills, setWaterBills] = useState([]);
            const [taxes, setTaxes] = useState([]);
            const [locations, setLocations] = useState([]);

            // 身份驗證監聽
            useEffect(() => {
                const { auth } = window.FB;
                
                const trySignIn = async (retries = 5, delay = 1000) => {
                    try {
                        await auth.signInAnonymously();
                    } catch (err) {
                        if (retries > 0) {
                            await new Promise(res => setTimeout(res, delay));
                            return trySignIn(retries - 1, delay * 2);
                        }
                        console.error("Auth Fail", err);
                        setAuthError("無法連線至雲端服務，請檢查網路狀態。");
                    }
                };

                trySignIn();

                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) setUser(u);
                });

                return () => unsubscribe();
            }, []);

            // 數據實時監聽
            useEffect(() => {
                if (!user) return;
                const { db } = window.FB;
                const basePath = `artifacts/${window.APP_ID}/public/data`;

                const unsubIns = db.collection(`${basePath}/insurances`).onSnapshot(snap => {
                    setInsurances(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubPay = db.collection(`${basePath}/payments`).onSnapshot(snap => {
                    setPayments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubPower = db.collection(`${basePath}/powerBills`).onSnapshot(snap => {
                    setPowerBills(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubWater = db.collection(`${basePath}/waterBills`).onSnapshot(snap => {
                    setWaterBills(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubTax = db.collection(`${basePath}/taxes`).onSnapshot(snap => {
                    setTaxes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubLoc = db.collection(`${basePath}/locations`).onSnapshot(snap => {
                    const locData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLocations(locData.length > 0 ? locData : [
                        { id: 'loc-1', name: '北屯總部' }, { id: 'loc-2', name: '崇德門市' }, { id: 'loc-3', name: '生產中心' }
                    ]);
                    setLoading(false);
                });

                return () => {
                    unsubIns(); unsubPay(); unsubPower(); unsubWater(); unsubTax(); unsubLoc();
                };
            }, [user]);

            const allUtilities = useMemo(() => {
                const combined = [
                    ...payments.map(p => ({ ...p, type: p.type || '其他' })),
                    ...powerBills.map(b => ({ ...b, type: '電力' })),
                    ...waterBills.map(b => ({ ...b, type: '水費' }))
                ];
                return combined.sort((a, b) => (b.period || '').localeCompare(a.period || ''));
            }, [payments, powerBills, waterBills]);

            const chartData = useMemo(() => {
                const dataMap = {};
                const processList = (list) => {
                    list.forEach(b => {
                        if (filterLocation !== '全部場域' && b.location !== filterLocation) return;
                        if (filterDateStart && b.period < filterDateStart) return;
                        if (filterDateEnd && b.period > filterDateEnd) return;
                        if (!dataMap[b.period]) dataMap[b.period] = { period: b.period, totalAmount: 0 };
                        const key = `${b.location}度數`;
                        dataMap[b.period][key] = (dataMap[b.period][key] || 0) + (Number(b.usage) || 0);
                        dataMap[b.period].totalAmount += (Number(b.amount) || 0);
                    });
                };
                processList(powerBills);
                processList(waterBills);
                return Object.values(dataMap).sort((a, b) => a.period.localeCompare(b.period));
            }, [powerBills, waterBills, filterLocation, filterDateStart, filterDateEnd]);

            const stats = useMemo(() => {
                const pendingAmount = allUtilities.filter(u => !u.isPaid).reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
                const insuranceAlerts = insurances.filter(i => i.status !== '有效').length;
                const pendingTaxes = taxes.filter(t => t.status !== '已繳').length;
                return { pendingAmount, insuranceAlerts, pendingTaxes, totalRecords: allUtilities.length + taxes.length };
            }, [allUtilities, insurances, taxes]);

            const handleUpdateRecord = async (coll, id, data) => {
                if (!user) return;
                const { db, serverTimestamp } = window.FB;
                const basePath = `artifacts/${window.APP_ID}/public/data`;
                await db.collection(`${basePath}/${coll}`).doc(id).set({
                    ...data,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                setShowModal(false);
            };

            const handleDeleteRecord = async (coll, id) => {
                if (!user || !window.confirm('確定要刪除嗎？此動作將無法復原。')) return;
                const { db } = window.FB;
                const basePath = `artifacts/${window.APP_ID}/public/data`;
                await db.collection(`${basePath}/${coll}`).doc(id).delete();
            };

            const handleAddSubmit = async (e, type) => {
                e.preventDefault();
                if (!user) return;
                setIsSaving(true);
                const { db, serverTimestamp } = window.FB;
                const fd = new FormData(e.target);
                const raw = Object.fromEntries(fd.entries());
                const newId = crypto.randomUUID();
                
                const basePath = `artifacts/${window.APP_ID}/public/data`;
                let coll = '';
                let data = { ...raw, createdAt: serverTimestamp(), userId: user.uid };

                if (type === 'utility') {
                    coll = raw.type === '電力' ? 'powerBills' : (raw.type === '水費' ? 'waterBills' : 'payments');
                    data.amount = Number(raw.amount);
                    data.usage = Number(raw.usage || 0);
                    data.isPaid = false;
                } else if (type === 'tax') {
                    coll = 'taxes';
                    data.status = '待繳';
                } else if (type === 'location') {
                    coll = 'locations';
                } else if (type === 'insurance') {
                    coll = 'insurances';
                    data.status = '處理中';
                }

                try {
                    await db.collection(`${basePath}/${coll}`).doc(newId).set(data);
                    setShowModal(false);
                } finally { setIsSaving(false); }
            };

            const handleEditTaxSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                setIsSaving(true);
                const fd = new FormData(e.target);
                const raw = Object.fromEntries(fd.entries());
                try {
                    await handleUpdateRecord('taxes', selectedItem.id, raw);
                } finally {
                    setIsSaving(false);
                }
            };

            if (authError) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-50 p-6 text-center">
                    <Icon name="alert-circle" size={48} className="text-rose-500 mb-4" />
                    <h2 className="text-xl font-black text-slate-800 mb-2">網路或系統連線異常</h2>
                    <p className="text-slate-500 mb-6">{authError}</p>
                    <button onClick={() => window.location.reload()} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg">重新整理</button>
                </div>
            );

            if (!user || loading) return <div className="h-screen flex flex-col items-center justify-center bg-white italic font-black text-indigo-500 animate-pulse text-xl">數據安全加載中...</div>;

            const COLORS = ["#6366f1", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6", "#06b6d4"];

            return (
                <div className="min-h-screen bg-[#F8FAFC] flex antialiased">
                    {/* Sidebar */}
                    <aside className="w-72 bg-white border-r border-slate-200 hidden lg:flex flex-col sticky top-0 h-screen z-30">
                        <div className="p-8">
                            <div className="bg-indigo-600 p-6 rounded-[2.5rem] shadow-xl text-white">
                                <h1 className="font-black text-xl italic tracking-tighter text-center">蒙恩行政雲</h1>
                                <p className="text-[10px] font-bold opacity-60 uppercase tracking-widest mt-1 text-center font-mono">v115 Multi-Year</p>
                            </div>
                        </div>
                        <nav className="flex-1 px-6 space-y-1 overflow-y-auto pb-10 custom-scrollbar">
                            <p className="px-6 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 mt-4">主要面板</p>
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-4 px-6 py-3.5 rounded-2xl transition-all font-black text-sm ${activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-600 shadow-sm' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="layout-dashboard" /><span>儀表板總覽</span>
                            </button>
                            <button onClick={() => setActiveTab('utilities')} className={`w-full flex items-center space-x-4 px-6 py-3.5 rounded-2xl transition-all font-black text-sm ${activeTab === 'utilities' ? 'bg-indigo-50 text-indigo-600 shadow-sm' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="zap" /><span>水電登記管理</span>
                            </button>

                            <p className="px-6 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 mt-6">規費週期管理</p>
                            {['每月', '每2個月', '每季', '年度'].map((p, idx) => (
                                <button key={idx} onClick={() => setActiveTab(`tax-${idx}`)} className={`w-full flex items-center space-x-4 px-6 py-3.5 rounded-2xl transition-all font-black text-sm ${activeTab === `tax-${idx}` ? 'bg-amber-50 text-amber-600' : 'text-slate-400 hover:bg-slate-50'}`}>
                                    <Icon name="clock" /><span>{p}繳納</span>
                                </button>
                            ))}

                            <p className="px-6 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 mt-6">系統設定</p>
                            <button onClick={() => setActiveTab('insurance')} className={`w-full flex items-center space-x-4 px-6 py-3.5 rounded-2xl transition-all font-black text-sm ${activeTab === 'insurance' ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="shield-check" /><span>保險合約追蹤</span>
                            </button>
                            <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center space-x-4 px-6 py-3.5 rounded-2xl transition-all font-black text-sm ${activeTab === 'settings' ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="settings" /><span>廠區場域設定</span>
                            </button>
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-y-auto">
                        <header className="h-24 bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-20 flex items-center justify-between px-12">
                            <h2 className="text-xl font-black text-slate-800 tracking-tight italic uppercase">
                                {activeTab === 'dashboard' ? '行政數據概覽' : 
                                 activeTab === 'utilities' ? '水電數據資產庫' : 
                                 activeTab.startsWith('tax-') ? `規費管理：${['每月', '每2個月', '每季', '年度'][activeTab.split('-')[1]]}` : 
                                 activeTab === 'insurance' ? '保險效期監控' : '廠區配置後台'}
                            </h2>
                            <div className="flex items-center space-x-6">
                                <div className="hidden md:block text-right">
                                    <p className="text-sm font-black text-slate-800 italic">管理後台</p>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest font-mono">ID: {window.APP_ID}</p>
                                </div>
                                <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 border border-indigo-100 shadow-sm">
                                    <Icon name="user" size={24} />
                                </div>
                            </div>
                        </header>

                        <div className="p-8 lg:p-12 max-w-7xl w-full mx-auto pb-20">
                            {/* Dashboard */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-8 animate-in fade-in duration-500">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        {[
                                            { label: '水電待繳總額', val: `$${stats.pendingAmount.toLocaleString()}`, color: 'text-rose-600', bg: 'bg-rose-50', icon: "dollar-sign" },
                                            { label: '規費待繳筆數', val: `${stats.pendingTaxes} 筆`, color: 'text-amber-600', bg: 'bg-amber-50', icon: "receipt" },
                                            { label: '保險合約警示', val: `${stats.insuranceAlerts} 件`, color: 'text-indigo-600', bg: 'bg-indigo-50', icon: "shield" },
                                            { label: '系統總數據量', val: `${stats.totalRecords} 條`, color: 'text-emerald-600', bg: 'bg-emerald-50', icon: "database" },
                                        ].map((card, i) => (
                                            <div key={i} className={`p-8 rounded-[2.5rem] border border-white shadow-sm transition-all hover:-translate-y-1 ${card.bg}`}>
                                                <div className="flex justify-between items-start mb-4 text-slate-400">
                                                    <span className="text-[10px] font-black uppercase tracking-widest">{card.label}</span>
                                                    <Icon name={card.icon} />
                                                </div>
                                                <h3 className={`text-2xl font-black tracking-tighter ${card.color}`}>{card.val}</h3>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-2 space-y-8">
                                            <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100 h-[450px]">
                                                <h4 className="text-sm font-black text-slate-400 mb-8 flex items-center uppercase tracking-widest italic"><Icon name="zap" className="mr-2 text-yellow-500" /> 各場域用電趨勢 (kWh)</h4>
                                                <div className="h-80 w-full">
                                                    {chartData.length > 0 ? (
                                                        <ResponsiveContainer width="100%" height="100%">
                                                            <LineChart data={chartData}>
                                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                                <XAxis dataKey="period" axisLine={false} tickLine={false} tick={{fill: '#94a3b8', fontSize: 10}} dy={10} />
                                                                <YAxis axisLine={false} tickLine={false} tick={{fill: '#94a3b8', fontSize: 10}} />
                                                                <Tooltip contentStyle={{borderRadius: '20px', border: 'none'}} />
                                                                <Legend iconType="circle" />
                                                                {locations.map((loc, idx) => (
                                                                    <Line key={loc.id} type="monotone" name={loc.name} dataKey={`${loc.name}度數`} stroke={COLORS[idx % COLORS.length]} strokeWidth={4} dot={{r: 5, strokeWidth: 3, fill: '#fff'}} connectNulls />
                                                                ))}
                                                            </LineChart>
                                                        </ResponsiveContainer>
                                                    ) : <div className="h-full flex items-center justify-center text-slate-300 font-bold italic">尚無足夠數據</div>}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100 flex flex-col h-[450px]">
                                            <h4 className="text-sm font-black text-slate-400 mb-8 flex items-center uppercase tracking-widest italic"><Icon name="receipt" className="mr-2 text-amber-500" /> 近期待繳規費</h4>
                                            <div className="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar">
                                                {taxes.filter(t => t.status !== '已繳').length === 0 ? (
                                                    <div className="h-full flex flex-col items-center justify-center text-slate-300 italic">
                                                        <Icon name="check-circle" size={48} className="mb-4 opacity-20" />
                                                        <p>目前無待繳項目</p>
                                                    </div>
                                                ) : (
                                                    taxes.filter(t => t.status !== '已繳').map(tax => (
                                                        <div key={tax.id} className="p-5 bg-slate-50 rounded-2xl border border-transparent hover:border-indigo-100 transition-all group">
                                                            <div className="flex justify-between items-start mb-2">
                                                                <span className="text-[9px] font-black bg-white px-2 py-1 rounded-lg text-amber-600 shadow-sm">{tax.period}</span>
                                                                <button onClick={() => handleUpdateRecord('taxes', tax.id, { status: '已繳' })} className="text-[10px] font-black text-indigo-600 hover:underline">確認繳費</button>
                                                            </div>
                                                            <p className="font-black text-slate-800 text-sm mb-1">{tax.name}</p>
                                                            <p className="text-[10px] text-slate-400">負責：{tax.payer}</p>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'utilities' && (
                                <div className="space-y-8 animate-in slide-in-from-bottom-8">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-2xl font-black text-slate-800 italic">水電電信費用清單</h3>
                                        <button onClick={() => { setModalType('utility'); setShowModal(true); }} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl flex items-center text-sm font-black shadow-xl hover:-translate-y-1 transition-all"><Icon name="plus" className="mr-2" /> 新增登記</button>
                                    </div>
                                    <div className="bg-white rounded-[3rem] border border-slate-100 overflow-hidden shadow-sm">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left font-black">
                                                <thead className="bg-slate-50/50 border-b">
                                                    <tr className="text-[10px] text-slate-400 uppercase tracking-widest">
                                                        <th className="px-10 py-8">廠區據點</th><th className="px-10 py-8">類別</th><th className="px-10 py-8 text-center">期別</th><th className="px-10 py-8 text-center">用量</th><th className="px-10 py-8 text-center">金額</th><th className="px-10 py-8 text-center">狀態</th><th className="px-10 py-8 text-right pr-20">操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    {allUtilities.map(p => (
                                                        <tr key={p.id} className="hover:bg-slate-50/30 group">
                                                            <td className="px-10 py-8 text-sm italic">{p.location}</td>
                                                            <td className="px-10 py-8"><span className={`px-4 py-1.5 rounded-xl text-[10px] border font-black ${p.type === '電力' ? 'bg-yellow-50 text-yellow-600' : 'bg-blue-50 text-blue-600'}`}>{p.type}</span></td>
                                                            <td className="px-10 py-8 text-xs font-mono text-indigo-500 text-center">{p.period}</td>
                                                            <td className="px-10 py-8 text-center">{p.usage || '-'}</td>
                                                            <td className="px-10 py-8 text-center text-base font-black">${Number(p.amount || 0).toLocaleString()}</td>
                                                            <td className="px-10 py-8 text-center">
                                                                <button onClick={() => handleUpdateRecord(p.type === '電力' ? 'powerBills' : (p.type === '水費' ? 'waterBills' : 'payments'), p.id, { isPaid: !p.isPaid })} className={`text-[10px] font-black px-4 py-1.5 rounded-full border transition-all ${p.isPaid ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-500 border-rose-100'}`}>{p.isPaid ? '已繳費' : '待繳費'}</button>
                                                            </td>
                                                            <td className="px-10 py-8 text-right pr-20"><button onClick={() => handleDeleteRecord(p.type === '電力' ? 'powerBills' : (p.type === '水費' ? 'waterBills' : 'payments'), p.id)} className="text-slate-200 hover:text-rose-500 opacity-0 group-hover:opacity-100"><Icon name="trash-2" size={18} /></button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab.startsWith('tax-') && (
                                <div className="space-y-8 animate-in slide-in-from-bottom-8">
                                    <div className="flex justify-between items-center px-4">
                                        <h3 className="text-2xl font-black text-slate-800 italic underline decoration-amber-500 decoration-4 underline-offset-8">
                                            {['每月', '每2個月', '每季', '年度'][activeTab.split('-')[1]]}繳納清單
                                        </h3>
                                        <button onClick={() => { setModalType('add_tax'); setShowModal(true); }} className="bg-amber-600 text-white px-8 py-4 rounded-2xl flex items-center text-sm font-black shadow-xl hover:-translate-y-1 transition-all"><Icon name="plus" className="mr-2" /> 新增稅目</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {taxes.filter(t => t.period === ['每月', '每2個月', '每季', '年度'][activeTab.split('-')[1]]).map(tax => (
                                            <div key={tax.id} className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all group relative">
                                                <div className="flex justify-between items-start mb-8">
                                                    <span className="text-[10px] font-black text-amber-600 uppercase bg-amber-50 px-4 py-2 rounded-xl">{tax.period}</span>
                                                    <button onClick={() => handleUpdateRecord('taxes', tax.id, { status: tax.status === '已繳' ? '待繳' : '已繳' })} className={`text-[10px] font-black px-4 py-2 rounded-full border transition-all ${tax.status === '已繳' ? 'bg-emerald-50 text-emerald-500 border-emerald-100' : 'bg-rose-50 text-rose-500 border-rose-100'}`}>{tax.status}</button>
                                                </div>
                                                <h5 className="font-black text-slate-800 text-lg mb-2">{tax.name}</h5>
                                                <p className="text-xs text-slate-400 font-bold mb-10 italic">管理員：{tax.payer}</p>
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setSelectedItem(tax); setModalType('edit_tax'); setShowModal(true); }} className="flex-1 py-4 bg-slate-50 text-slate-400 text-xs font-black rounded-2xl hover:bg-slate-100 transition-all italic shadow-inner">編輯詳情</button>
                                                    <button onClick={() => handleDeleteRecord('taxes', tax.id)} className="w-12 h-12 flex items-center justify-center bg-rose-50 text-rose-500 rounded-2xl hover:bg-rose-500 hover:text-white transition-all"><Icon name="trash-2" size={16} /></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'insurance' && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 animate-in fade-in duration-500">
                                    {insurances.map(ins => (
                                        <div key={ins.id} className="bg-white p-10 rounded-[3rem] border-b-8 border-indigo-500/10 shadow-sm hover:shadow-xl group">
                                            <div className="flex justify-between mb-8 text-[10px] font-black italic">
                                                <span className="text-slate-400 uppercase bg-slate-100 px-4 py-1.5 rounded-xl">{ins.type}</span>
                                                <span className={ins.status === '有效' ? 'text-emerald-500' : 'text-amber-500'}>● {ins.status}</span>
                                            </div>
                                            <h5 className="font-black text-slate-800 text-xl mb-2 tracking-tight">{ins.name}</h5>
                                            <p className="text-xs text-slate-400 font-bold mb-8 italic opacity-70 leading-relaxed">{ins.provider}</p>
                                            <div className="bg-slate-50 p-6 rounded-[2rem] flex justify-between items-center mb-8 border border-slate-100 shadow-inner">
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest font-mono">截止日</span>
                                                <span className="font-black text-indigo-600 text-lg underline decoration-amber-300 decoration-4 underline-offset-4">{ins.end}</span>
                                            </div>
                                            <div className="flex gap-4">
                                                <button onClick={() => { setSelectedItem(ins); setModalType('insurance_update'); setShowModal(true); }} className="flex-1 py-4 bg-slate-900 text-white text-[10px] font-black rounded-2xl hover:bg-indigo-600 transition-all uppercase tracking-widest shadow-md">修改狀態</button>
                                                <button onClick={() => handleDeleteRecord('insurances', ins.id)} className="w-12 h-12 flex items-center justify-center bg-rose-50 text-rose-400 rounded-2xl hover:bg-rose-500 hover:text-white transition-all shadow-sm"><Icon name="trash-2" size={18}/></button>
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => { setModalType('add_insurance'); setShowModal(true); }} className="border-4 border-dashed border-slate-100 rounded-[3.5rem] flex flex-col items-center justify-center p-12 text-slate-300 hover:border-indigo-200 transition-all hover:bg-indigo-50/20"><Icon name="plus" size={48} className="mb-4" /><span className="font-black uppercase tracking-widest text-center">建立新保險標的</span></button>
                                </div>
                            )}

                            {activeTab === 'settings' && (
                                <div className="bg-white rounded-[3rem] border border-slate-100 p-10 shadow-sm animate-in slide-in-from-bottom-8">
                                    <div className="flex justify-between items-center mb-10 px-4">
                                        <h3 className="text-2xl font-black text-slate-800 italic underline decoration-indigo-500 decoration-4 underline-offset-8">據點管理</h3>
                                        <button onClick={() => { setModalType('location'); setShowModal(true); }} className="bg-slate-900 text-white px-8 py-4 rounded-2xl flex items-center text-sm font-black shadow-lg"><Icon name="plus" className="mr-2" /> 新增場域</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        {locations.map(loc => (
                                            <div key={loc.id} className="p-6 bg-slate-50 rounded-[2.5rem] flex items-center justify-between group border border-transparent hover:border-indigo-100 transition-all hover:bg-white hover:shadow-md">
                                                <div className="flex items-center gap-4 text-slate-700 font-black"><Icon name="building" className="text-indigo-600" /> {loc.name}</div>
                                                <button onClick={() => handleDeleteRecord('locations', loc.id)} className="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="x" size={18} /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        {showModal && (
                            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-2xl z-50 flex items-center justify-center p-6 animate-in fade-in duration-300">
                                <div className="bg-white rounded-[4rem] w-full max-w-lg overflow-hidden shadow-2xl border border-white/20 animate-in zoom-in-95">
                                    <div className="p-12 border-b border-slate-50 flex justify-between items-center bg-slate-50/40">
                                        <h3 className="font-black text-2xl text-slate-800 italic underline decoration-indigo-600 underline-offset-8 decoration-4">系統發布與更新</h3>
                                        <button onClick={() => setShowModal(false)} className="bg-white p-4 rounded-full text-slate-400 hover:text-rose-500 shadow-sm active:scale-90 transition-colors"><Icon name="x" size={24} /></button>
                                    </div>
                                    <div className="p-12">
                                        {modalType === 'utility' && (
                                            <form onSubmit={(e) => handleAddSubmit(e, 'utility')} className="space-y-8 font-black text-xs">
                                                <div className="grid grid-cols-2 gap-6"><div className="space-y-3"><label>場域據點</label><select name="location" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black">{locations.map(l => <option key={l.id} value={l.name}>{l.name}</option>)}</select></div><div className="space-y-3"><label>支出類別</label><select name="type" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black"><option>電力</option><option>水費</option><option>電信</option></select></div></div>
                                                <div className="grid grid-cols-2 gap-6"><div className="space-y-3"><label>期別 (YYYY/MM)</label><input name="period" placeholder="115/01" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required /></div><div className="space-y-3"><label>度數</label><input name="usage" type="number" step="0.1" placeholder="0.0" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" /></div></div>
                                                <div className="space-y-3"><label>金額 (TWD)</label><input name="amount" type="number" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner text-indigo-600 outline-none font-black" required /></div>
                                                <button type="submit" disabled={isSaving} className="w-full py-7 bg-indigo-600 text-white rounded-[2rem] font-black uppercase tracking-[0.4em] shadow-lg shadow-indigo-100">{isSaving ? "處理中..." : "同步數據發布"}</button>
                                            </form>
                                        )}
                                        {modalType === 'add_tax' && (
                                            <form onSubmit={(e) => handleAddSubmit(e, 'tax')} className="space-y-8 font-black text-xs">
                                                <div className="space-y-3"><label>規費標的名稱</label><input name="name" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required /></div>
                                                <div className="grid grid-cols-2 gap-6"><div className="space-y-3"><label>週期</label><select name="period" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black"><option value="每月">每月</option><option value="2個月">2個月</option><option value="每季">每季</option><option value="年度">年度</option></select></div><div className="space-y-3"><label>負責人</label><input name="payer" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required /></div></div>
                                                <button type="submit" className="w-full py-7 bg-amber-600 text-white rounded-[2rem] font-black uppercase tracking-[0.4em] shadow-lg shadow-amber-100">確認建立</button>
                                            </form>
                                        )}
                                        {modalType === 'edit_tax' && (
                                            <form onSubmit={handleEditTaxSubmit} className="space-y-8 font-black text-xs">
                                                <div className="space-y-3">
                                                    <label className="text-slate-400 uppercase ml-4 tracking-widest">規費名稱</label>
                                                    <input name="name" defaultValue={selectedItem?.name} className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required />
                                                </div>
                                                <div className="grid grid-cols-2 gap-6">
                                                    <div className="space-y-3">
                                                        <label className="text-slate-400 uppercase ml-4 tracking-widest">週期</label>
                                                        <select name="period" defaultValue={selectedItem?.period} className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black">
                                                            <option value="每月">每月</option>
                                                            <option value="2個月">2個月</option>
                                                            <option value="每季">每季</option>
                                                            <option value="年度">年度</option>
                                                        </select>
                                                    </div>
                                                    <div className="space-y-3">
                                                        <label className="text-slate-400 uppercase ml-4 tracking-widest">負責人</label>
                                                        <input name="payer" defaultValue={selectedItem?.payer} className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required />
                                                    </div>
                                                </div>
                                                <button type="submit" disabled={isSaving} className="w-full py-7 bg-amber-600 text-white rounded-[2rem] font-black uppercase tracking-widest shadow-lg shadow-amber-100">
                                                    {isSaving ? "更新中..." : "保存變更"}
                                                </button>
                                            </form>
                                        )}
                                        {modalType === 'location' && (
                                            <form onSubmit={(e) => handleAddSubmit(e, 'location')} className="space-y-8 font-black text-xs"><div className="space-y-3"><label>廠區場域名稱</label><input name="name" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required /></div><button type="submit" className="w-full py-7 bg-slate-900 text-white rounded-[2rem] font-black uppercase tracking-widest">新增廠區據點</button></form>
                                        )}
                                        {modalType === 'add_insurance' && (
                                            <form onSubmit={(e) => handleAddSubmit(e, 'insurance')} className="space-y-8 font-black text-xs">
                                                <div className="space-y-3"><label>合約標的名稱</label><input name="name" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required /></div>
                                                <div className="grid grid-cols-2 gap-6"><div className="space-y-3"><label>公司</label><input name="provider" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black" required /></div><div className="space-y-3"><label>種類</label><select name="type" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black"><option>車險</option><option>火險</option><option>責任險</option></select></div></div>
                                                <div className="space-y-3"><label>到期日期</label><input name="end" placeholder="YYYY.MM.DD" className="w-full bg-slate-50 border-none rounded-[1.8rem] p-6 shadow-inner outline-none font-black font-mono" required /></div>
                                                <button type="submit" className="w-full py-7 bg-indigo-600 text-white rounded-[2rem] font-black uppercase tracking-widest">發布標的</button>
                                            </form>
                                        )}
                                        {modalType === 'insurance_update' && (
                                            <div className="space-y-4 font-black">
                                                <p className="text-[10px] text-slate-400 uppercase mb-6 tracking-widest text-center italic">變更合約狀態: {selectedItem?.name}</p>
                                                {['有效', '待扣款', '已續保', '處理中', '已停保'].map(status => (
                                                    <button key={status} onClick={() => handleUpdateRecord('insurances', selectedItem.id, { status })} className={`w-full py-6 px-10 rounded-[2.5rem] text-sm text-left transition-all ${selectedItem.status === status ? 'bg-indigo-600 text-white shadow-xl scale-[1.02]' : 'bg-slate-50 text-slate-500 hover:bg-slate-100 hover:translate-x-2'}`}>{status}</button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
